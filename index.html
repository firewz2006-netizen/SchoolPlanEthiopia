<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SchoolPlan Ethiopia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#1a3a6b">
<style>
:root{--bg:#f4f5f8;--fg:#14181f;--mut:#5b6472;--card:#fff;--line:#dce0e8;--navy:#1a3a6b;--green:#1b6e5a;--purple:#7650a0;--orange:#a65e25;--red:#b3261e;--teal:#0f6b7a;--maroon:#8a3b3b;--slate:#475569;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--fg:#eef1f5;--mut:#9aa3b2;--card:#171b22;--line:#2a303b;--red:#f2958f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1116;--fg:#eef1f5;--mut:#9aa3b2;--card:#171b22;--line:#2a303b;--red:#f2958f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,'Noto Sans Ethiopic',sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.5rem;margin:8px 0 2px}
h2{font-size:1.2rem;margin:0}
.sub{color:var(--mut);margin:0 0 16px;font-size:.95rem}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;width:44px;height:44px;font-size:1.2rem;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:18px;color:#fff;padding:22px 10px;font:inherit;font-weight:600;font-size:1.05rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:130px;justify-content:center}
.tile svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:.85rem;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid #4c8dff;outline-offset:2px}
.btn{width:100%;margin-top:12px;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:600;color:#fff;cursor:pointer;background:var(--accent)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row b{display:block}
.row span{color:var(--mut);font-size:.88rem}
.x{border:0;background:none;color:var(--red);font:inherit;cursor:pointer;padding:8px}
.pa{display:flex;gap:6px}
.pa button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;min-width:64px;padding:8px;font:inherit;cursor:pointer}
.pa button.on-p{background:var(--green);color:#fff;border-color:var(--green)}
.pa button.on-a{background:var(--red);color:#fff;border-color:var(--red)}
.sc{width:84px}
.empty{color:var(--mut);text-align:center;padding:14px 0}
.sum{font-weight:600}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.d{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 0;font:inherit;cursor:pointer}
.d.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:max-content;min-width:100%;font-size:.88rem}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}
th:first-child,td:first-child{position:sticky;left:0;background:var(--card);text-align:left}
.c{min-width:36px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 0;font:inherit;cursor:pointer}
.c.p{background:#1b6e5a;color:#fff;border-color:#1b6e5a}
.c.a{background:#b3261e;color:#fff;border-color:#b3261e}
.sg{border:1px dashed var(--line);border-radius:12px;padding:10px;margin-top:10px}
.ln{border-bottom:1.5px solid var(--fg);height:30px;margin-top:2px}
.vt th,.vt td{white-space:normal;min-width:120px;text-align:left;vertical-align:top}
.vt th{background:var(--bg)}
.doc h3{margin:4px 0 8px;font-size:1.05rem}
.meta{color:var(--mut);font-size:.9rem;margin:2px 0}
.ok{color:var(--green);font-weight:600;font-size:.9rem}
.sec{margin-top:8px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 2px;font:inherit;font-size:.8rem;cursor:pointer}
.vt.dy th,.vt.dy td{min-width:34px;text-align:center}.vt.dy th:first-child,.vt.dy td:first-child{min-width:120px;text-align:left}
.tabs button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.pad{display:block;width:100%;height:160px;background:#fff;border:1.5px solid var(--line);border-radius:10px;touch-action:none}
.sgi{display:block;max-height:90px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px}
@media (prefers-reduced-motion:no-preference){.tile{transition:transform .12s}.tile:active{transform:scale(.97)}}
</style></head>
<body><main id="app"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var S,USER=null;
function lg(k){try{return localStorage.getItem(k)}catch(e){return null}}
function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function loadS(raw){var d=null;try{d=JSON.parse(raw||'null')}catch(e){}
S=d||{annual:[],daily:[],students:[],att:{},assess:[]};
S.meta=S.meta||{teacher:'',year:'',dept:'',director:''};S.reports=S.reports||[];S.sigs=S.sigs||{};S.meta.school=S.meta.school||''}
loadS(null);
var saveT=null;
function save(){if(!USER)return;var j=JSON.stringify(S);ls('sp:'+USER,j);
 if(j.length>900000)alert('መረጃው በጣም ትልቅ ነው። Data is near the 1 MB online limit; remove some signatures or old records.');
 clearTimeout(saveT);saveT=setTimeout(function(){if(db&&UID)db.collection('teachers').doc(UID).set({data:j,t:Date.now()}).catch(function(){})},800)}
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var today=function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
var attDate=today();
var ICON={annual:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',daily:'<svg viewBox="0 0 24 24"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg>',attendance:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg>',assessment:'<svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM9 11h6M9 15h6"/></svg>',view:'<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',report:'<svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>',backup:'<svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg>'};
var TILES=[['annual','Annual Plan','--navy'],['daily','Daily Plan','--green'],['attendance','Attendance','--purple'],['assessment','Assessment','--orange'],['view','View Plans','--teal'],['report','Report to Departments &amp; Director','--maroon'],['backup','Backup &amp; Restore','--slate']];
var ACC={annual:'--navy',daily:'--green',attendance:'--purple',assessment:'--orange',view:'--teal',report:'--maroon',backup:'--slate'};
var TITLE={annual:'Annual Lesson Plan',daily:'Daily Lesson Plan',attendance:'Student Attendance',assessment:'Continuous Assessment',view:'View Plans',report:'Report to Departments &amp; Director',backup:'Backup &amp; Restore'};
function v(id){var e=document.getElementById(id);return e?e.value.trim():''}
function fld(id,l,t,ph){return '<label for="'+id+'">'+l+'</label><input id="'+id+'" type="'+(t||'text')+'" placeholder="'+(ph||'')+'">'}
function ta(id,l,r){return '<label for="'+id+'">'+l+'</label><textarea id="'+id+'" rows="'+(r||2)+'"></textarea>'}
function go(r){location.hash=r}
function head(r){return '<div class="top"><button class="back" onclick="go(\'home\')" aria-label="Back">←</button><h2>'+TITLE[r]+'</h2></div>'}
function btn(r,t,fn){return '<button class="btn" style="--accent:var('+ACC[r]+')" onclick="'+fn+'">'+t+'</button>'}
function list(arr,fn,empty){if(!arr.length)return '<div class="empty">'+empty+'</div>';return arr.map(fn).join('')}

function home(){
  return '<h1>SchoolPlan Ethiopia</h1><p class="sub">Lesson plans, attendance and assessment for teachers</p><div class="grid">'+
  TILES.map(function(t){return '<button class="tile" style="background:var('+t[2]+')'+(t[0]==='backup'?';grid-column:1/-1;min-height:90px':'')+'" onclick="go(\''+t[0]+'\')">'+ICON[t[0]]+t[1]+'</button>'}).join('')+'</div><button class="btn" style="--accent:var(--slate)" onclick="logout()">ውጣ / Log out ('+esc(USER)+')</button>';
}
function rowv(pairs){return pairs.filter(function(p){return p[1]}).map(function(p){return '<br><b style="display:inline">'+p[0]+':</b> '+esc(p[1])}).join('')}
function annual(){
  return head('annual')+metaCard()+'<div class="card">'+fld('a_sub','Subject','text','e.g. ICT')+'<label for="a_month">Months</label><select id="a_month">'+['September','October','November','December','January','February','March','April','May','June'].map(function(m){return '<option>'+m+'</option>'}).join('')+'</select>'+
  fld('a_days','Days','text','e.g. 1-5 / Monday')+fld('a_topic','Topic / Subtopic')+fld('a_per','Period','number')+
  ta('a_spec','Specific objectives',2)+ta('a_gen','General objectives',2)+fld('a_met','Methods','text','e.g. group discussion')+fld('a_med','Media','text','e.g. projector, chart')+ta('a_ass','Assessment',2)+
  btn('annual','Add to plan',"add('annual')")+'</div>'+
  '<div class="card">'+list(S.annual,function(x,i){return '<div class="row"><div><b>'+esc(x.month)+' · '+esc(x.topic)+'</b><span>'+rowv([['Subject',x.sub],['Days',x.days],['Period',x.per],['Specific objectives',x.spec],['General objectives',x.gen],['Methods',x.met],['Media',x.med],['Assessment',x.ass]]).replace(/^<br>/,'')+'</span></div><button class="x" onclick="del(\'annual\','+i+')">Delete</button></div>'},'No plans added yet.')+'</div>'+planActions('annual')+sigCard();
}
function daily(){
  return head('daily')+metaCard()+'<div class="card">'+fld('d_sub','Subject','text','e.g. ICT')+fld('d_days','Days','text','e.g. Monday / Meskerem 5')+ta('d_intro','Introduction (5\')',2)+ta('d_main','Main activity (30\')',3)+ta('d_sum','Summary / Conclusion (5\')',2)+fld('d_topic','Content')+fld('d_time','Time','text','e.g. 40 min / 3rd period')+ta('d_obj','Specific objective',2)+
  ta('d_tea','Teacher activity',3)+ta('d_stu','Student activity',3)+fld('d_met','Teaching method','text','e.g. group discussion')+fld('d_med','Media','text','e.g. projector, chart')+
  ta('d_ass','Assessment',2)+btn('daily','Save plan',"add('daily')")+'</div>'+
  '<div class="card">'+list(S.daily,function(x,i){return '<div class="row"><div><b>'+esc(x.topic)+'</b><span>'+rowv([['Subject',x.sub],['Days',x.days||x.date],['Introduction (5\')',x.intro],['Main activity (30\')',x.main],['Summary / Conclusion (5\')',x.sum],['Time',x.time],['Specific objective',x.obj],['Teacher activity',x.tea],['Student activity',x.stu],['Teaching method',x.met],['Media',x.med],['Assessment',x.ass]]).replace(/^<br>/,'')+'</span></div><button class="x" onclick="del(\'daily\','+i+')">Delete</button></div>'},'No daily plans yet.')+'</div>'+planActions('daily')+sigCard();
}
var MONTHS=['September','October','November','December','January','February','March','April','May','June'];
var attMonth=MONTHS[0];
function am(){S.att[attMonth]=S.att[attMonth]||{days:[],rec:{}};return S.att[attMonth]}
function attendance(){
  var m=am(),days=m.days.slice().sort(function(a,b){return a-b}),d,h;
  h=head('attendance')+metaCard()+'<div class="card"><label for="at_month">Month</label><select id="at_month" onchange="attMonth=this.value;render()">'+MONTHS.map(function(x){return '<option'+(x===attMonth?' selected':'')+'>'+x+'</option>'}).join('')+'</select>'+
  '<label>School days (tap the days school was open)</label><div class="days">';
  for(d=1;d<=31;d++)h+='<button class="d'+(m.days.indexOf(d)>-1?' on':'')+'" onclick="toggleDay('+d+')" aria-pressed="'+(m.days.indexOf(d)>-1)+'">'+d+'</button>';
  h+='</div><p class="sum">School days in '+attMonth+': '+days.length+'</p></div>';
  if(!S.students.length)h+='<div class="card empty">Add students below first.</div>';
  else if(!days.length)h+='<div class="card empty">Select the school days above.</div>';
  else{
    h+='<div class="card"><div class="tw"><table><thead><tr><th>Student name</th><th>Sex</th><th>Age</th>'+days.map(function(x){return '<th>'+x+'</th>'}).join('')+'<th>Present</th><th>Absent</th></tr></thead><tbody>';
    S.students.forEach(function(s){
      var r=m.rec[s.id]||{},p=0,a=0;
      days.forEach(function(x){if(r[x]==='p')p++;if(r[x]==='a')a++});
      h+='<tr><td>'+esc(s.name)+'</td><td>'+esc(s.sex||'—')+'</td><td>'+esc(s.age||'—')+'</td>'+days.map(function(x){return '<td><button class="c '+(r[x]||'')+'" onclick="mark('+s.id+','+x+')" aria-label="'+esc(s.name)+', day '+x+'">'+(r[x]==='p'?'P':r[x]==='a'?'A':'–')+'</button></td>'}).join('')+'<td>'+p+'</td><td>'+a+'</td></tr>';
    });
    h+='</tbody></table></div><p class="sub" style="margin:10px 0 0">Tap a cell to mark Present (P), Absent (A) or clear it.</p></div>';
  }
  h+='<div class="card"><h2>Add student</h2>'+fld('s_name','Student name')+'<label for="s_sex">Sex</label><select id="s_sex"><option>Male</option><option>Female</option></select>'+fld('s_age','Age','number')+btn('attendance','Add student',"addStudent()")+
  S.students.map(function(s,i){return '<div class="row"><span>'+esc(s.name)+' · '+esc(s.sex||'—')+' · '+esc(s.age||'—')+'</span><button class="x" onclick="delStudent('+i+')">Delete</button></div>'}).join('')+'</div>';
  return h+planActions('attendance')+sigCard();
}
function toggleDay(d){var m=am(),i=m.days.indexOf(d);if(i>-1)m.days.splice(i,1);else m.days.push(d);save();render()}
var SC=[['quiz','Quiz',5],['assign','Assignment',10],['project','Project',10],['mid','Mid exam',15],['final','Final exam',60]];
function tot(s){var t=0;SC.forEach(function(k){t+=+((s.sc||{})[k[0]])||0});return t}
function assessment(){
  return head('assessment')+metaCard()+'<div class="card">'+fld('m_name','Student name')+'<label for="m_sex">Sex</label><select id="m_sex"><option>Male</option><option>Female</option></select>'+fld('m_age','Age','number')+
  SC.map(function(k){return fld('m_'+k[0],k[1]+' (out of '+k[2]+')','number')}).join('')+'<p class="sum">Total: <span id="m_tot">0</span> / 100</p>'+btn('assessment','Save student',"addRec()")+'</div>'+
  list(S.students,function(s,i){var sc=s.sc||{};return '<div class="card"><div class="row"><div><b>'+esc(s.name)+'</b><span>'+esc(s.sex||'—')+' · Age '+esc(s.age||'—')+'</span></div><div class="sum">Total: '+tot(s)+' / 100</div></div>'+
    SC.map(function(k){return '<div class="row"><span>'+k[1]+' (out of '+k[2]+')</span><input class="sc" type="number" inputmode="decimal" min="0" max="'+k[2]+'" value="'+esc(sc[k[0]]===undefined?'':sc[k[0]])+'" onchange="score('+i+',\''+k[0]+'\',this.value)" aria-label="'+k[1]+' - '+esc(s.name)+'"></div>'}).join('')+
    '<button class="x" onclick="delStudent('+i+')">Delete student</button></div>'},'No students yet.')+planActions('assessment')+sigCard();
}
function add(k){
  var o;
  if(k==='annual'){o={sub:v('a_sub'),month:v('a_month'),days:v('a_days'),topic:v('a_topic'),per:v('a_per'),spec:v('a_spec'),gen:v('a_gen'),met:v('a_met'),med:v('a_med'),ass:v('a_ass')};if(!o.topic)return alert('Enter the topic / subtopic.')}
  else{o={sub:v('d_sub'),days:v('d_days'),intro:v('d_intro'),main:v('d_main'),sum:v('d_sum'),topic:v('d_topic'),obj:v('d_obj'),time:v('d_time'),tea:v('d_tea'),stu:v('d_stu'),met:v('d_met'),med:v('d_med'),ass:v('d_ass')};if(!o.topic)return alert('Enter the content.')}
  S[k].push(o);save();render();
}
function del(k,i){S[k].splice(i,1);save();render()}
function addStudent(){var n=v('s_name');if(!n)return alert('Enter the student name.');S.students.push({id:Date.now(),name:n,sex:v('s_sex'),age:v('s_age'),sc:{}});save();render()}
function delStudent(i){S.students.splice(i,1);save();render()}
function mark(id,d){var m=am();m.rec[id]=m.rec[id]||{};var c=m.rec[id][d];m.rec[id][d]=!c?'p':c==='p'?'a':'';save();render()}
function addRec(){var n=v('m_name');if(!n)return alert('Enter the student name.');var sc={},bad=null;SC.forEach(function(k){var x=v('m_'+k[0]);sc[k[0]]=x;if(x!==''&&(+x<0||+x>k[2]))bad=k});if(bad)return alert(bad[1]+' must be between 0 and '+bad[2]+'.');S.students.push({id:Date.now(),name:n,sex:v('m_sex'),age:v('m_age'),sc:sc});save();render()}
function score(i,k,val){var m=SC.filter(function(x){return x[0]===k})[0];if(val!==''&&(+val<0||+val>m[2])){alert(m[1]+' must be between 0 and '+m[2]+'.');render();return}S.students[i].sc=S.students[i].sc||{};S.students[i].sc[k]=val;save();render()}

function setMeta(k,val,src){S.meta[k]=val;save();document.querySelectorAll('[data-mk="'+k+'"]').forEach(function(e){if(e!==src)e.value=val});if(document.getElementById('rp_text'))refreshPrev()}
function mf(k,l,ph,pre){return '<label for="'+pre+'_'+k+'">'+l+'</label><input id="'+pre+'_'+k+'" data-mk="'+k+'" value="'+esc(S.meta[k]||'')+'" placeholder="'+ph+'" oninput="setMeta(\''+k+'\',this.value,this)">'}
function schoolCard(pre){return '<div class="card">'+mf('school','School Name','School name',pre)+'</div>'}
function metaCard(){return '<div class="card">'+mf('school','School Name','School name','mt')+mf('teacher','Teacher Name','Full name','mt')+mf('year','Academic year','e.g. 2026/2027','mt')+'</div>'}
var signing=null,drew=false;
function sg(label,k,ph,pre){var g=S.sigs[k],h='<div class="sg"><b>'+label+'</b>'+mf(k,'Name',ph,pre)+'<label>Digital signature</label>';
  if(g)h+='<img class="sgi" src="'+g.img+'" alt="Signature of '+esc(S.meta[k]||label)+'"><p class="ok">✓ Signed '+esc(g.date)+'</p><button class="x" onclick="rmSig(\''+k+'\')">Remove signature</button>';
  else if(signing===k)h+='<canvas id="pad" class="pad" aria-label="Signature pad"></canvas><p class="meta">Draw your signature or thumb mark with your finger.</p><div class="pa"><button onclick="clearPad()">Clear</button><button class="on-p" onclick="saveSig(\''+k+'\')">Save</button><button onclick="signing=null;render()">Cancel</button></div>';
  else h+='<button class="btn" style="--accent:var(--navy)" onclick="startSig(\''+k+'\')">Sign with finger</button>';
  return h+'</div>'}
function startSig(k){signing=k;render()}
function initPad(){var c=document.getElementById('pad');if(!c)return;var r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;var x=c.getContext('2d');x.scale(d,d);x.fillStyle='#fff';x.fillRect(0,0,r.width,r.height);x.lineWidth=2.5;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#1a3a6b';drew=false;var down=false;
  function pt(e){var b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]}
  c.onpointerdown=function(e){down=true;drew=true;try{c.setPointerCapture(e.pointerId)}catch(z){}var q=pt(e);x.beginPath();x.moveTo(q[0],q[1]);x.lineTo(q[0]+.1,q[1]+.1);x.stroke();e.preventDefault()};
